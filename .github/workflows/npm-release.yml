name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      extension_tag:
        description: Exact pentestkit GitHub release tag containing the automation artifacts
        required: true
        type: string
      extension_version:
        description: Three-part PTK release family, for example 9.9.8
        required: true
        type: string
      chromium_extension_version:
        description: Exact Chromium store version; leave blank to use the release family
        required: false
        default: ''
        type: string
      firefox_extension_version:
        description: Exact Firefox store version; leave blank to use the release family
        required: false
        default: ''
        type: string
      extension_provenance_sha256:
        description: SHA-256 of extension-provenance-automation.json from that release
        required: true
        type: string
      package_version:
        description: npm version, for example 9.9.8-rc.1 or 9.9.8
        required: true
        type: string
      dist_tag:
        description: npm dist-tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: pentestkit-npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: pentestkit@${{ inputs.package_version }} (${{ inputs.dist_tag }})
    runs-on: ubuntu-latest
    environment: npm-release
    env:
      EXTENSION_REPOSITORY: DenisPodgurskii/pentestkit
      EXTENSION_TAG: ${{ inputs.extension_tag }}
      EXTENSION_VERSION: ${{ inputs.extension_version }}
      CHROMIUM_EXTENSION_VERSION: ${{ inputs.chromium_extension_version || inputs.extension_version }}
      FIREFOX_EXTENSION_VERSION: ${{ inputs.firefox_extension_version || inputs.extension_version }}
      EXTENSION_PROVENANCE_SHA256: ${{ inputs.extension_provenance_sha256 }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      DIST_TAG: ${{ inputs.dist_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.18.0

      - name: Validate release request
        run: |
          node npm/scripts/verify-release-intent.cjs \
            --extension-tag "$EXTENSION_TAG" \
            --extension-version "$EXTENSION_VERSION" \
            --chromium-extension-version "$CHROMIUM_EXTENSION_VERSION" \
            --firefox-extension-version "$FIREFOX_EXTENSION_VERSION" \
            --package-version "$PACKAGE_VERSION" \
            --dist-tag "$DIST_TAG" \
            --provenance-sha256 "$EXTENSION_PROVENANCE_SHA256" \
            --check-registry

      - name: Download exact automation-extension release artifacts
        run: |
          mkdir -p dist
          gh release download "$EXTENSION_TAG" --repo "$EXTENSION_REPOSITORY" --dir dist --pattern "extension-provenance-automation.json"
          gh release download "$EXTENSION_TAG" --repo "$EXTENSION_REPOSITORY" --dir dist --pattern "chrome_${CHROMIUM_EXTENSION_VERSION}_automation.zip"
          gh release download "$EXTENSION_TAG" --repo "$EXTENSION_REPOSITORY" --dir dist --pattern "firefox_${FIREFOX_EXTENSION_VERSION}_automation.zip"
          gh release download "$EXTENSION_TAG" --repo "$EXTENSION_REPOSITORY" --dir dist --pattern "ptk-latest-automation.crx"
          gh release download "$EXTENSION_TAG" --repo "$EXTENSION_REPOSITORY" --dir dist --pattern "ptk-latest-automation.xpi"

      - name: Verify artifact pin, hashes, manifests, and automation identity
        run: |
          node npm/scripts/verify-extension-artifacts.cjs \
            --input-dir dist \
            --version "$EXTENSION_VERSION" \
            --chromium-version "$CHROMIUM_EXTENSION_VERSION" \
            --firefox-version "$FIREFOX_EXTENSION_VERSION" \
            --provenance-sha256 "$EXTENSION_PROVENANCE_SHA256"

      - name: Install npm workspace dependencies
        run: npm ci --ignore-scripts --prefix npm

      - name: Install Agent test dependencies
        run: npm ci --ignore-scripts --prefix npm/agents

      - name: Run repository, Agent, framework, and provider preflight
        run: |
          npm --prefix npm run test:ci
          npm --prefix npm run preflight:release-frameworks -- --mode source

      - name: Build and smoke the publishable tarball
        run: |
          node npm/scripts/prepare-npm-package.cjs \
            --artifact-source automation-artifact \
            --input-dir dist \
            --out-dir npm/.release/npm \
            --package-version "$PACKAGE_VERSION" \
            --publishable

      - name: Upload reviewed package artifact
        uses: actions/upload-artifact@v7
        with:
          name: pentestkit-${{ inputs.package_version }}
          path: npm/.release/npm/pentestkit-*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Publish with npm trusted publishing
        run: |
          TARBALL="npm/.release/npm/pentestkit-${PACKAGE_VERSION}.tgz"
          test -f "$TARBALL"
          npm publish "$TARBALL" --tag "$DIST_TAG" --access public --provenance
